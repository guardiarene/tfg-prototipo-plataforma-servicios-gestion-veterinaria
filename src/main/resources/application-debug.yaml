# Solo para uso local: loguea los valores de los parámetros SQL.
# Se combina con otro perfil: -Dspring-boot.run.profiles=dev,debug
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE
